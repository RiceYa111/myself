<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Myself · 数据看板</title>
<style>
:root{--bg:#141a2e;--panel:#1f2846;--line:#38466e;--ink:#eef2ff;--muted:#9aa8cf;--mint:#7ef0c8;--gold:#ffd479;--red:#ff8f8f}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei",system-ui,sans-serif;padding:24px;max-width:960px;margin:0 auto}
h1{font-size:22px;margin-bottom:4px}
.sub{color:var(--muted);font-size:13px;margin-bottom:20px}
.setup{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.setup input{flex:1;min-width:200px;background:#121831;border:1px solid var(--line);border-radius:9px;color:var(--ink);padding:10px 12px;font-size:14px}
.setup button{background:var(--mint);color:#0d2b20;border:0;border-radius:9px;padding:10px 18px;font-size:14px;cursor:pointer;font-weight:700}
.setup button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.card .k{font-size:12px;color:var(--muted);margin-bottom:6px}
.card .v{font-size:26px;font-weight:800}
.card .hint{font-size:11px;color:var(--muted);margin-top:4px}
.mint{color:var(--mint)}.gold{color:var(--gold)}.red{color:var(--red)}
.funnel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:20px}
.funnel h2{font-size:15px;margin-bottom:14px}
.frow{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.frow .label{width:150px;font-size:13px;color:var(--muted);text-align:right}
.frow .bar{height:22px;border-radius:6px;background:linear-gradient(90deg,#54b9c2,#7ef0c8);min-width:3px;transition:width .4s}
.frow .num{font-size:13px;min-width:110px}
table{width:100%;border-collapse:collapse;background:var(--panel);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
th,td{padding:10px 12px;font-size:13px;text-align:right;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:400;background:#1a2340}
td:first-child,th:first-child{text-align:left}
.err{color:var(--red);font-size:13px;margin-top:8px}
.section-title{font-size:15px;margin:22px 0 10px}
</style>
</head>
<body>
<h1>Myself · 数据看板</h1>
<p class="sub">首次上线核心指标 · 数据来自 Cloudflare Worker（仅计数，不含任何聊天内容）</p>

<div class="setup">
  <input id="base" placeholder="Worker 地址，如 https://myself-relay.xxx.workers.dev">
  <button onclick="load()">加载数据</button>
  <button class="ghost" onclick="demo()">先看演示数据</button>
  <div class="err" id="err"></div>
</div>

<div class="cards" id="cards"></div>

<div class="funnel">
  <h2>核心转化漏斗（今日）</h2>
  <div id="funnel"></div>
</div>

<div class="section-title">近 7 天趋势</div>
<table id="trend"></table>

<script>
const $=id=>document.getElementById(id);
$('base').value=localStorage.getItem('dash-base')||'https://myself-relay.riceya.workers.dev';

function pct(a,b){return b?Math.round(a/b*100)+'%':'—'}
function ev(day,name){return (day&&day.events&&day.events[name])||0}

function render(data){
  const days=data.days||{};
  const dates=Object.keys(days).sort().reverse();
  const today=days[dates[0]]||{sessions:0,events:{},newUsers:0,returningUsers:0};
  const e=today.events||{};
  const visitors=(today.newUsers||0)+(today.returningUsers||0);
  const chats=ev(today,'chat_turn');
  const creates=ev(today,'create_success');
  const completes=ev(today,'complete_success');
  const aiOk=ev(today,'ai_response'),aiErr=ev(today,'ai_error');
  const aiRate=(aiOk+aiErr)?Math.round(aiOk/(aiOk+aiErr)*100)+'%':'—';

  $('cards').innerHTML=[
    ['今日会话',today.sessions||0,'用户打开应用的次数','mint'],
    ['独立访客',visitors,'新 '+(''+(today.newUsers||0))+' · 回头 '+(''+(today.returningUsers||0)),'mint'],
    ['开口率',pct(chats,today.sessions),'聊过天的会话占比 · 最关键指标','gold'],
    ['计划转化率',pct(creates,today.sessions),'创建目标的会话占比','gold'],
    ['任务完成数',completes,'完成率 '+pct(completes,creates),'mint'],
    ['AI 成功率',aiRate,'失败 '+aiErr+' 次 · 健康线 95%','gold'],
  ].map(c=>`<div class="card"><div class="k">${c[0]}</div><div class="v ${c[3]}">${c[1]}</div><div class="hint">${c[2]}</div></div>`).join('');

  const steps=[
    ['打开应用',today.sessions||0],
    ['看到开场白',ev(today,'agent_greeting_shown')],
    ['开始聊天',chats],
    ['生成计划',ev(today,'plan_draft_generated')],
    ['确认创建目标',creates],
    ['完成任务',completes],
  ];
  const max=Math.max(...steps.map(s=>s[1]),1);
  $('funnel').innerHTML=steps.map((s,i)=>{
    const prev=i?steps[i-1][1]:0;
    const rate=i&&prev?Math.round(s[1]/prev*100)+'%':'';
    return `<div class="frow"><div class="label">${s[0]}</div><div class="bar" style="width:${Math.round(s[1]/max*52)}%"></div><div class="num">${s[1]} ${rate?'<span style="color:var(--muted)">'+rate+'</span>':''}</div></div>`;
  }).join('');

  $('trend').innerHTML='<tr><th>日期</th><th>会话</th><th>新访客</th><th>回头客</th><th>聊天轮次</th><th>创建目标</th><th>完成任务</th><th>AI失败</th></tr>'+
    dates.map(d=>{const x=days[d]||{events:{}};return `<tr><td>${d}</td><td>${x.sessions||0}</td><td>${x.newUsers||0}</td><td>${x.returningUsers||0}</td><td>${ev(x,'chat_turn')}</td><td>${ev(x,'create_success')}</td><td>${ev(x,'complete_success')}</td><td>${ev(x,'ai_error')}</td></tr>`}).join('');
}

async function load(){
  $('err').textContent='';
  const base=$('base').value.trim().replace(/\/$/,'');
  if(!base){$('err').textContent='请填写 Worker 地址';return}
  localStorage.setItem('dash-base',base);
  try{
    const r=await fetch(base+'/api/stats');
    if(!r.ok)throw new Error('请求失败 ('+r.status+')');
    render(await r.json());
  }catch(e){$('err').textContent=e.message+'（Worker 还没部署好的话，先点「先看演示数据」）'}
}

function demo(){
  const mk=(s,n,r,chat,plan,create,done,greet,aiErr)=>({sessions:s,newUsers:n,returningUsers:r,events:{agent_greeting_shown:greet,chat_turn:chat,plan_draft_generated:plan,create_success:create,complete_success:done,ai_response:chat*1-aiErr,ai_error:aiErr,page_view:s*3,outfit_preview:Math.round(s*.4)}});
  render({days:{
    '2026-10-07':mk(42,28,2,96,20,12,7,38,3),
    '2026-10-08':mk(65,40,6,160,34,19,11,60,4),
    '2026-10-09':mk(58,33,9,148,30,17,13,52,2),
  }});
  $('err').textContent='这是演示数据。部署完成后填上 Worker 地址，点「加载数据」看真实数据。';
}
if($('base').value)load();
</script>
</body>
</html>
