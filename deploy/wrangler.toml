name = "myself-relay"
main = "worker.js"
compatibility_date = "2026-10-01"

# 非密钥变量（部署前把 ALLOWED_ORIGINS 改成你的 GitHub Pages 地址）
[vars]
MODEL = "deepseek-chat"
BASE_URL = "https://api.deepseek.com"
ALLOWED_ORIGINS = "https://riceya111.github.io"
PER_IP_DAILY = "30"
GLOBAL_DAILY = "500"

# KV 命名空间（限流计数 + 埋点统计用）
[[kv_namespaces]]
binding = "MYSELF_KV"
id = "352f8c870e3c48bdb9ae0807e5e435c3"
